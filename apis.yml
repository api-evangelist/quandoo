aid: quandoo
name: Quandoo
description: >-
  Quandoo is a restaurant reservations marketplace that connects diners with
  thousands of restaurants and provides merchants with table and reservation
  management tooling. Quandoo publishes a Public Partner API, a multi-purpose
  REST API that enables core functionality across the Quandoo platform,
  including checking availability for merchants, creating and managing
  reservations and reservation enquiries, reading merchant-level reservation
  settings, and table planning. Reservation creation is idempotent via
  agent-supplied unique identifiers. Quandoo also offers widget and portal
  integration paths plus an interactive API explorer for developers building
  booking experiences on top of its inventory.
type: Index
