naftiko: 1.0.0-alpha2
info:
  label: Quandoo Public Partner API — Validations
  description: 'Validations surface of the Quandoo Public Partner API. 1 operations. Lead operation: Quandoo Validate Phone Number. Self-contained Naftiko capability covering one Quandoo business surface.'
  tags:
  - Quandoo
  - Reservations
  - Validations
  created: '2026-06-03'
  modified: '2026-06-03'
binds:
- namespace: env
  keys:
    QUANDOO_AUTH_TOKEN: QUANDOO_AUTH_TOKEN
capability:
  consumes:
  - type: http
    namespace: quandoo-public-partner-api-validations
    baseUri: https://public-api.prod.quandoo.com
    description: Quandoo Public Partner API — Validations business capability. Self-contained, no shared references.
    authentication:
      type: apikey
      key: X-Quandoo-AuthToken
      value: '{{env.QUANDOO_AUTH_TOKEN}}'
      placement: header
    resources:
    - name: validations-phone-numbers
      path: /v1/validations/phone-numbers
      operations:
      - name: validatePhoneNumber_1
        method: GET
        description: Quandoo Validate Phone Number
        inputParameters:
        - name: phoneNumber
          in: query
          type: string
          required: true
          description: Phone number
        - name: country
          in: query
          type: string
          required: false
          description: Country code
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: quandoo-public-partner-api-validations-rest
    port: 8080
    description: REST adapter for Quandoo Public Partner API — Validations. One Spectral-compliant resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/validations/phone-numbers
      name: validations-phone-numbers
      description: REST surface for validations-phone-numbers.
      operations:
      - method: GET
        name: validatePhoneNumber_1
        description: Quandoo Validate Phone Number
        call: quandoo-public-partner-api-validations.validatePhoneNumber_1
        with:
          phoneNumber: rest.phoneNumber
          country: rest.country
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: quandoo-public-partner-api-validations-mcp
    port: 9090
    transport: http
    description: MCP adapter for Quandoo Public Partner API — Validations. One tool per consumed operation, routed inline through this capability's consumes block.
    tools:
    - name: validate-phone-number
      description: Quandoo Validate Phone Number
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: quandoo-public-partner-api-validations.validatePhoneNumber_1
      with:
        phoneNumber: tools.phoneNumber
        country: tools.country
      outputParameters:
      - type: object
        mapping: $.
