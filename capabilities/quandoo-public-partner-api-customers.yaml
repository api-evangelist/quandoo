naftiko: 1.0.0-alpha2
info:
  label: Quandoo Public Partner API — Customers
  description: 'Customers surface of the Quandoo Public Partner API. 3 operations. Lead operation: Quandoo Get Customer Data. Self-contained Naftiko capability covering one Quandoo business surface.'
  tags:
  - Quandoo
  - Reservations
  - Customers
  created: '2026-06-03'
  modified: '2026-06-03'
binds:
- namespace: env
  keys:
    QUANDOO_AUTH_TOKEN: QUANDOO_AUTH_TOKEN
capability:
  consumes:
  - type: http
    namespace: quandoo-public-partner-api-customers
    baseUri: https://public-api.prod.quandoo.com
    description: Quandoo Public Partner API — Customers business capability. Self-contained, no shared references.
    authentication:
      type: apikey
      key: X-Quandoo-AuthToken
      value: '{{env.QUANDOO_AUTH_TOKEN}}'
      placement: header
    resources:
    - name: customers-customerid
      path: /v1/customers/{customerId}
      operations:
      - name: getCustomer_1
        method: GET
        description: Quandoo Get Customer Data
        inputParameters:
        - name: customerId
          in: path
          type: string
          required: true
          description: Id of the customer
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: customers-customerid-reservations
      path: /v1/customers/{customerId}/reservations
      operations:
      - name: getReservations_1
        method: GET
        description: Quandoo Get Customer Reservations
        inputParameters:
        - name: customerId
          in: path
          type: string
          required: true
          description: Id of the customer
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: merchants-merchantid-customers
      path: /v1/merchants/{merchantId}/customers
      operations:
      - name: getCustomersOfMerchant_1
        method: GET
        description: Quandoo Get a List of Customers of a Merchant
        inputParameters:
        - name: merchantId
          in: path
          type: integer
          required: true
          description: Id of the merchant
        - name: offset
          in: query
          type: integer
          required: false
          description: offset
        - name: limit
          in: query
          type: integer
          required: false
          description: limit
        - name: modifiedSince
          in: query
          type: string
          required: false
          description: 'modifiedSince. Format: yyyy-MM-dd HH:mm:ss'
        - name: modifiedUntil
          in: query
          type: string
          required: false
          description: 'modifiedUntil. Format: yyyy-MM-dd HH:mm:ss'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: quandoo-public-partner-api-customers-rest
    port: 8080
    description: REST adapter for Quandoo Public Partner API — Customers. One Spectral-compliant resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/customers/{customerid}
      name: customers-customerid
      description: REST surface for customers-customerid.
      operations:
      - method: GET
        name: getCustomer_1
        description: Quandoo Get Customer Data
        call: quandoo-public-partner-api-customers.getCustomer_1
        with:
          customerId: rest.customerId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/customers/{customerid}/reservations
      name: customers-customerid-reservations
      description: REST surface for customers-customerid-reservations.
      operations:
      - method: GET
        name: getReservations_1
        description: Quandoo Get Customer Reservations
        call: quandoo-public-partner-api-customers.getReservations_1
        with:
          customerId: rest.customerId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/merchants/{merchantid}/customers
      name: merchants-merchantid-customers
      description: REST surface for merchants-merchantid-customers.
      operations:
      - method: GET
        name: getCustomersOfMerchant_1
        description: Quandoo Get a List of Customers of a Merchant
        call: quandoo-public-partner-api-customers.getCustomersOfMerchant_1
        with:
          merchantId: rest.merchantId
          offset: rest.offset
          limit: rest.limit
          modifiedSince: rest.modifiedSince
          modifiedUntil: rest.modifiedUntil
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: quandoo-public-partner-api-customers-mcp
    port: 9090
    transport: http
    description: MCP adapter for Quandoo Public Partner API — Customers. One tool per consumed operation, routed inline through this capability's consumes block.
    tools:
    - name: get-customer-data
      description: Quandoo Get Customer Data
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: quandoo-public-partner-api-customers.getCustomer_1
      with:
        customerId: tools.customerId
      outputParameters:
      - type: object
        mapping: $.
    - name: get-customer-reservations
      description: Quandoo Get Customer Reservations
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: quandoo-public-partner-api-customers.getReservations_1
      with:
        customerId: tools.customerId
      outputParameters:
      - type: object
        mapping: $.
    - name: get-list-customers-merchant
      description: Quandoo Get a List of Customers of a Merchant
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: quandoo-public-partner-api-customers.getCustomersOfMerchant_1
      with:
        merchantId: tools.merchantId
        offset: tools.offset
        limit: tools.limit
        modifiedSince: tools.modifiedSince
        modifiedUntil: tools.modifiedUntil
      outputParameters:
      - type: object
        mapping: $.
