naftiko: 1.0.0-alpha2
info:
  label: Quandoo Public Partner API — Merchants
  description: 'Merchants surface of the Quandoo Public Partner API. 5 operations. Lead operation: Quandoo Allows to Get a Merchant by Id and Find Similar Merchants. Self-contained Naftiko capability covering one Quandoo business surface.'
  tags:
  - Quandoo
  - Reservations
  - Merchants
  created: '2026-06-03'
  modified: '2026-06-03'
binds:
- namespace: env
  keys:
    QUANDOO_AUTH_TOKEN: QUANDOO_AUTH_TOKEN
capability:
  consumes:
  - type: http
    namespace: quandoo-public-partner-api-merchants
    baseUri: https://public-api.prod.quandoo.com
    description: Quandoo Public Partner API — Merchants business capability. Self-contained, no shared references.
    authentication:
      type: apikey
      key: X-Quandoo-AuthToken
      value: '{{env.QUANDOO_AUTH_TOKEN}}'
      placement: header
    resources:
    - name: merchants-merchantid-similar
      path: /v1/merchants/{merchantId}/similar
      operations:
      - name: searchSimilar_1
        method: GET
        description: Quandoo Allows to Get a Merchant by Id and Find Similar Merchants
        inputParameters:
        - name: merchantId
          in: path
          type: integer
          required: true
          description: merchantId
        - name: sort
          in: query
          type: string
          required: false
          description: Sort order. Default sorting will be by proximity.
        - name: limit
          in: query
          type: integer
          required: false
          description: Max number of merchant recommendations to return.
        - name: Accept-Language
          in: header
          type: string
          required: false
          description: Locale.<br>Format:<br>&lt;language code&gt;[_&lt;country code&gt;]
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: merchants-merchantid
      path: /v1/merchants/{merchantId}
      operations:
      - name: search_2
        method: GET
        description: Quandoo Allows to Get a Merchant by Id
        inputParameters:
        - name: merchantId
          in: path
          type: integer
          required: true
          description: merchantId
        - name: Accept-Language
          in: header
          type: string
          required: false
          description: Locale.<br>Format:<br>&lt;language code&gt;[_&lt;country code&gt;]
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: merchants
      path: /v1/merchants
      operations:
      - name: search
        method: GET
        description: Quandoo Allows to Get Merchant Information by Parameters
        inputParameters:
        - name: query
          in: query
          type: string
          required: false
          description: Search query for a merchant name
        - name: place
          in: query
          type: string
          required: false
          description: 'Search query for a place (country, city or district) name: the most relevant places, if any, are taken as a filter'
        - name: placeIds
          in: query
          type: string
          required: false
          description: DEPRECATED. Filter by place found by id. Semicolon separated.
        - name: centerPoint
          in: query
          type: string
          required: false
          description: Search with coordinates and radius. "radius" argument can be set, otherwise default value of 10 km will be used.<br>Format:<br>53.1222,13.0303<br>where latitude=53.1222, longitude=13.0303
        - name: radius
          in: query
          type: integer
          required: false
          description: Radius for coordinate-based search
        - name: bookable
          in: query
          type: boolean
          required: false
          description: Filter only bookable merchants
        - name: tags
          in: query
          type: string
          required: false
          description: "Filter by tags found by text. The value can be either in English or in the specific locale. Semicolon separated. All or nothing behaviour: if one single tag is not found, the whole request fails. Cannot be used in combination with 'groupedTagIds' parameter."
        - name: tagIds
          in: query
          type: string
          required: false
          description: "Filter by tags found by id. Semicolon separated. All or nothing behaviour: if one single tag id is not found, the whole request fails. Cannot be used in combination with 'tags' parameter."
        - name: reviewScoreMax
          in: query
          type: integer
          required: false
          description: Filter by max review score (100 - 600)
        - name: onlyWithAttributes
          in: query
          type: string
          required: false
          description: Search with attributes specified only. Attribute "documents" is currently supported, requires permission
        - name: capacity
          in: query
          type: integer
          required: true
          description: Number of people. In order to be effective, "date" and "fromTime" must also be set.
        - name: date
          in: query
          type: string
          required: false
          description: "Date of the desired reservation in merchants' time zone. Format: yyyy-MM-dd. Availability search is only activated if \"place\" is specified."
        - name: fromTime
          in: query
          type: string
          required: false
          description: "Beginning of the desired reservation time frame in merchants' time zone. Format: HH:mm. Consider a 3h buffer for the time (0.5h before the given time and 2.5h after)"
        - name: offset
          in: query
          type: integer
          required: false
          description: offset
        - name: limit
          in: query
          type: integer
          required: false
          description: limit
        - name: Accept-Language
          in: header
          type: string
          required: false
          description: language
        - name: ivrNumber
          in: query
          type: string
          required: false
          description: ivrNumber
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: merchants-merchantid-reservations
      path: /v1/merchants/{merchantId}/reservations
      operations:
      - name: getReservations_2
        method: GET
        description: Quandoo Get Merchant Reservations
        inputParameters:
        - name: merchantId
          in: path
          type: integer
          required: true
          description: Id of the merchant
        - name: offset
          in: query
          type: integer
          required: false
          description: Skip first n reservations
        - name: limit
          in: query
          type: integer
          required: false
          description: limit
        - name: earliest
          in: query
          type: string
          required: false
          description: 'earliest date time of time window in UTC. Format: yyyy-MM-dd HH:mm:ss'
        - name: latest
          in: query
          type: string
          required: false
          description: 'latest date time of time window in UTC. Format: yyyy-MM-dd HH:mm:ss'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: merchants-merchantid-reviews
      path: /v1/merchants/{merchantId}/reviews
      operations:
      - name: getReviews_1
        method: GET
        description: Quandoo Retrieves Customer Reviews for a Merchant, Specified by ReviewId
        inputParameters:
        - name: merchantId
          in: path
          type: integer
          required: true
          description: merchantId
        - name: offset
          in: query
          type: integer
          required: false
          description: Skip first n reviews
        - name: limit
          in: query
          type: integer
          required: false
          description: Max number of reviews to be retrieved
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: quandoo-public-partner-api-merchants-rest
    port: 8080
    description: REST adapter for Quandoo Public Partner API — Merchants. One Spectral-compliant resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/merchants/{merchantid}/similar
      name: merchants-merchantid-similar
