          tagIds: rest.tagIds
          reviewScoreMax: rest.reviewScoreMax
          onlyWithAttributes: rest.onlyWithAttributes
          capacity: rest.capacity
          date: rest.date
          fromTime: rest.fromTime
          offset: rest.offset
          limit: rest.limit
          Accept-Language: rest.Accept-Language
          ivrNumber: rest.ivrNumber
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/merchants/{merchantid}/reservations
      name: merchants-merchantid-reservations
      description: REST surface for merchants-merchantid-reservations.
      operations:
      - method: GET
        name: getReservations_2
        description: Quandoo Get Merchant Reservations
        call: quandoo-public-partner-api-merchants.getReservations_2
        with:
          merchantId: rest.merchantId
          offset: rest.offset
          limit: rest.limit
          earliest: rest.earliest
          latest: rest.latest
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/merchants/{merchantid}/reviews
      name: merchants-merchantid-reviews
      description: REST surface for merchants-merchantid-reviews.
      operations:
      - method: GET
        name: getReviews_1
        description: Quandoo Retrieves Customer Reviews for a Merchant, Specified by ReviewId
        call: quandoo-public-partner-api-merchants.getReviews_1
        with:
          merchantId: rest.merchantId
          offset: rest.offset
          limit: rest.limit
        outputParameters:
        - type: object
          mapping: $.
