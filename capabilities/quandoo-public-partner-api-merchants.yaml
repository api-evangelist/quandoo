        description: Quandoo Allows to Get a Merchant by Id and Find Similar Merchants
        call: quandoo-public-partner-api-merchants.searchSimilar_1
        with:
          merchantId: rest.merchantId
          sort: rest.sort
          limit: rest.limit
          Accept-Language: rest.Accept-Language
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/merchants/{merchantid}
      name: merchants-merchantid
      description: REST surface for merchants-merchantid.
      operations:
      - method: GET
        name: search_2
        description: Quandoo Allows to Get a Merchant by Id
        call: quandoo-public-partner-api-merchants.search_2
        with:
          merchantId: rest.merchantId
          Accept-Language: rest.Accept-Language
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/merchants
      name: merchants
      description: REST surface for merchants.
      operations:
      - method: GET
