naftiko: 1.0.0-alpha2
info:
  label: Quandoo Public Partner API — Reviews
  description: 'Reviews surface of the Quandoo Public Partner API. 3 operations. Lead operation: Quandoo Get Information from Reviews in a List. Self-contained Naftiko capability covering one Quandoo business surface.'
  tags:
  - Quandoo
  - Reservations
  - Reviews
  created: '2026-06-03'
  modified: '2026-06-03'
binds:
- namespace: env
  keys:
    QUANDOO_AUTH_TOKEN: QUANDOO_AUTH_TOKEN
capability:
  consumes:
  - type: http
    namespace: quandoo-public-partner-api-reviews
    baseUri: https://public-api.prod.quandoo.com
    description: Quandoo Public Partner API — Reviews business capability. Self-contained, no shared references.
    authentication:
      type: apikey
      key: X-Quandoo-AuthToken
      value: '{{env.QUANDOO_AUTH_TOKEN}}'
      placement: header
    resources:
    - name: reviews
      path: /v1/reviews
      operations:
      - name: getReviews_2
        method: GET
        description: Quandoo Get Information from Reviews in a List
        inputParameters:
        - name: merchantId
          in: query
          type: integer
          required: false
          description: MerchantId to get the reviews from. Cannot be used in combination with 'reservationId'
        - name: reservationId
          in: query
          type: string
          required: false
          description: Reservation id to get the reviews from. Either public id or agent reference id. Cannot be used in combination with 'merchantId'. When set, 'offset' and 'limit' are ignored. All reviews for a reservation are returned.
        - name: offset
          in: query
          type: integer
          required: false
          description: Skip first n reviews
        - name: limit
          in: query
          type: integer
          required: false
          description: Max number to retrieve
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createReview_1
        method: PUT
        description: Quandoo Create a Review for a Reservation
        inputParameters:
        - name: body
          in: body
          type: object
          required: true
          description: Request payload.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updateReview_1
        method: PATCH
        description: Quandoo Updated a Review
        inputParameters:
        - name: body
          in: body
          type: object
          required: true
          description: Request payload.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: quandoo-public-partner-api-reviews-rest
    port: 8080
    description: REST adapter for Quandoo Public Partner API — Reviews. One Spectral-compliant resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/reviews
      name: reviews
      description: REST surface for reviews.
      operations:
      - method: GET
        name: getReviews_2
        description: Quandoo Get Information from Reviews in a List
        call: quandoo-public-partner-api-reviews.getReviews_2
        with:
          merchantId: rest.merchantId
          reservationId: rest.reservationId
          offset: rest.offset
          limit: rest.limit
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: createReview_1
        description: Quandoo Create a Review for a Reservation
        call: quandoo-public-partner-api-reviews.createReview_1
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: PATCH
        name: updateReview_1
        description: Quandoo Updated a Review
        call: quandoo-public-partner-api-reviews.updateReview_1
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: quandoo-public-partner-api-reviews-mcp
    port: 9090
    transport: http
    description: MCP adapter for Quandoo Public Partner API — Reviews. One tool per consumed operation, routed inline through this capability's consumes block.
    tools:
    - name: get-information-reviews-list
      description: Quandoo Get Information from Reviews in a List
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: quandoo-public-partner-api-reviews.getReviews_2
      with:
        merchantId: tools.merchantId
        reservationId: tools.reservationId
        offset: tools.offset
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.
    - name: create-review-reservation
      description: Quandoo Create a Review for a Reservation
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: quandoo-public-partner-api-reviews.createReview_1
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: updated-review
      description: Quandoo Updated a Review
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: quandoo-public-partner-api-reviews.updateReview_1
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
