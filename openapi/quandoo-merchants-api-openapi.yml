  /v1/merchants/{merchantId}:
    get:
      tags:
      - Merchants
      summary: Quandoo Allows to Get a Merchant by Id
      operationId: search_2
      description: 'This endpoint allows to receive detailed information on a particular merchant in the system. This merchant should be specified by their identifier **merchantId**, which is mandatory. The endpoint can take optional request header **Accept-Language**. This header is used to determine correct locale and has an effect on translation of merchant''s entity fields, that may be omitted.


        The expected value of the header **Accept-Language** should contain language and can contain country, e.g. "de_DE" or "de". Locale by default is "en_GB".


        The endpoint returns status `HTTP 200` if the request is successful.

        The endpoint will return status `HTTP 404` if the merchant, specified by identifier, was not found or has no products, allowed for a web search.


        Example curl:

        ```

        curl -H ''X-Quandoo-AuthToken: {INSERT_KEY_HERE}'' -H ''Accept-Language: de_DE'' ''https://{host}/v{X}/merchants/11''

        ```


