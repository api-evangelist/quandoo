  /v1/merchants/{merchantId}/reviews:
    get:
      tags:
      - Merchants
      summary: Quandoo Retrieves Customer Reviews for a Merchant, Specified by ReviewId
      operationId: getReviews_1
      description: 'This endpoint retrieves customer reviews for a particular merchant with rating, description, locale, date & the customer''s information.This merchant should be specified by their identifier **merchantId**, which is mandatory.


        Supports pagination via offset & limit parameters in the request.


        `offset` allows skipping the first n reviews.

        `limit` makes sure the response contains a maximum of n reviews.


        If not supplied, offset will be 0 and limit will be 10


        ####Response:


        * **customer**: block contains link to customer''s profile image, customer''s first name & first letter of customer''s last name.

        * **rating**: a value between 1 and 6, where 1 represents the worst rating and 6 represents the best.

        * **description**: the review description entered by the customer.

        * **locale**: represents the language settings of the customer, in the format: _

        * **date**: represents the date of the review, with the format: yyyy-MM-dd


        Example curl:

        ```

        curl https://{host}/v{X}/merchants/15/reviews?offset=10&limit=5

        ```


        Example response:

        ```

        {

        reviews: [

        {

        customer: {

        firstName: "Hans",

        lastName: "W",

        profileImage: {

        url: "https://www..."

        },

        },

        rating: 1,

        description: "Foo bar",

        locale: "de_DE",

        date: "2017-07-21"

        }

        ],

        offset: 10,

        limit: 5,

        size: 1

        }

        ```'
      parameters:
      - name: merchantId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: offset
        in: query
        required: false
        description: Skip first n reviews
        schema:
          type: integer
          format: int32
          default: 0
      - name: limit
        in: query
        required: false
        description: Max number of reviews to be retrieved
        schema:
          type: integer
          format: int32
          default: 10
      responses:
        '200':
          description: Review response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewDtoList'
              examples:
                GetReviews1200Example:
                  summary: Default getReviews_1 200 response
                  x-microcks-default: true
                  value:
                    reviews:
                    - customer: {}
                      rating: {}
                      description: {}
                      locale: {}
                      date: {}
                    size: 1
                    offset: 1
                    limit: 1
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                GetReviews1400Example:
                  summary: Default getReviews_1 400 response
                  x-microcks-default: true
                  value:
                    errorType: BAD_REQUEST_ERROR
                    errorMessage: Window table preferred if available.
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                GetReviews1500Example:
                  summary: Default getReviews_1 500 response
                  x-microcks-default: true
                  value:
                    errorType: BAD_REQUEST_ERROR
                    errorMessage: Window table preferred if available.
        '404':
          description: Merchant not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
