  /v1/merchants:
    get:
      tags:
      - Merchants
      summary: Quandoo Allows to Get Merchant Information by Parameters
      operationId: search
      description: '###Description


        This endpoint is used to search merchants by a set of parameters.'
      parameters:
      - name: query
        in: query
        required: false
        description: Search query for a merchant name
        schema:
          type: string
      - name: place
        in: query
        required: false
        description: 'Search query for a place (country, city or district) name: the most relevant places, if any, are taken as a filter'
        schema:
          type: string
      - name: placeIds
        in: query
        required: false
        description: DEPRECATED. Filter by place found by id. Semicolon separated.
        schema:
          type: string
      - name: centerPoint
        in: query
        required: false
        description: Search with coordinates and radius. "radius" argument can be set, otherwise default value of 10 km will be used.<br>Format:<br>53.1222,13.0303<br>where latitude=53.1222, longitude=13.0303
        schema:
          type: string
      - name: radius
        in: query
        required: false
        description: Radius for coordinate-based search
        schema:
          type: integer
          format: int32
          default: 10
      - name: bookable
        in: query
        required: false
        description: Filter only bookable merchants
        schema:
          type: boolean
      - name: tags
        in: query
        required: false
        description: 'Filter by tags found by text. The value can be either in English or in the specific locale. Semicolon separated. All or nothing behaviour: if one single tag is not found, the whole request fails. Cannot be used in combination with ''groupedTagIds'' parameter.'
        schema:
          type: string
      - name: tagIds
        in: query
        required: false
        description: 'Filter by tags found by id. Semicolon separated. All or nothing behaviour: if one single tag id is not found, the whole request fails. Cannot be used in combination with ''tags'' parameter.'
        schema:
          type: string
      - name: reviewScoreMax
        in: query
        required: false
        description: Filter by max review score (100 - 600)
        schema:
          type: integer
          format: int32
      - name: onlyWithAttributes
        in: query
        required: false
        description: Search with attributes specified only. Attribute "documents" is currently supported, requires permission
        schema:
          type: string
      - name: capacity
        in: query
        required: true
        description: Number of people. In order to be effective, "date" and "fromTime" must also be set.
        schema:
          type: integer
          format: int32
          default: 2
      - name: date
        in: query
        required: false
        description: 'Date of the desired reservation in merchants'' time zone. Format: yyyy-MM-dd. Availability search is only activated if "place" is specified.'
        schema:
          type: string
          format: date
      - name: fromTime
        in: query
        required: false
        description: 'Beginning of the desired reservation time frame in merchants'' time zone. Format: HH:mm. Consider a 3h buffer for the time (0.5h before the given time and 2.5h after)'
        schema:
          type: string
      - name: offset
        in: query
        required: false
        description: offset
        schema:
          type: integer
          format: int32
          default: 0
      - name: limit
        in: query
        required: false
        description: limit
        schema:
          type: integer
          format: int32
          default: 100
      - name: Accept-Language
        in: header
        required: false
        description: language
        schema:
          type: string
      - name: ivrNumber
        in: query
        required: false
        description: ivrNumber
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantDetailsDtoList'
              examples:
                Search200Example:
                  summary: Default search 200 response
                  x-microcks-default: true
                  value:
                    merchants:
                    - id: {}
                      name: {}
                      phoneNumber: {}
                      currency: {}
                      locale: {}
                      timezone: {}
                      location: {}
                      reviewScore: {}
                      tagGroups: {}
                      images: {}
                      documents: {}
                      links: {}
                      bookable: {}
                      openingTimes: {}
                      ccvEnabled: {}
                      chain: {}
                      ivrRedirectNumber: {}
                      shortDescription: {}
                      longDescription: {}
                    size: 1
                    offset: 1
                    limit: 1
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Search400Example:
                  summary: Default search 400 response
                  x-microcks-default: true
                  value:
                    errorType: BAD_REQUEST_ERROR
                    errorMessage: Window table preferred if available.
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
  /v1/merchants/{merchantId}/reservations:
    get:
      tags:
      - Merchants
      summary: Quandoo Get Merchant Reservations
      operationId: getReservations_2
      description: 'This endpoint allows an agent to get reservations of a merchant. The results will be filtered by agent id.

        Reservation IDs in response are agent-specific. The agent needs to be authenticated.


        The endpoint will return `HTTP 404 - Not Found` if the merchant with the specified id could not be found.

        It will return `HTTP 403 - Forbidden` if the agent is not authenticated or the agent doesn''t have permissions.


        ####Request:

        * **merchantId**: ID of the merchant

        * **offset**: sets the starting element to be returned. Defaults to 0 when unset or malformed.

        * **limit**: maximum number of results to be returned. Value must be between 1 and 100. Defaults to 100 when unset, malformed or outside bounds.

        * **earliest**: earliest date time of time window in UTC. Format: yyyy-MM-dd HH:mm:ss

        * **latest**: latest date time of time window in UTC. Format: yyyy-MM-dd HH:mm:ss


        ####Response:

        The response will be a _list_ of reservations. Each reservation has the fields explained below:

        * **id**: The public id of the reservation

        * **number**: Quandoo internal identifier of the reservation.

        * **quandooId**: The public id of this reservation on quandoo system.

        * **status**: The status of the reservation eg. CREATED, CONFIRMED, CUSTOMER CANCELED etc.

        * **startTime**: The start time of the reservation. Format: `yyyy-MM-ddTHH:mm:ssZ`

        * **endTime**: The end time of the reservation. Format: `yyyy-MM-ddTHH:mm:ssZ`

        * **capacity**: The capacity (people count) of the reservation

        * **merchantId**: The ID of the merchant at which this reservation was made.

        * **customerId**: The public ID of the customer to which this reservation belongs

        * **promoCode**: The promotion code associated with this reservation. Optional.

        * **extraInfo**: extra information that the customer provided for the reservation. Optional.

        * **links**: Related links that can be followed based on this response.

        * **createdAt**: The date the reservation was created. Format: `yyyy-MM-ddTHH:mm:ssZ`

        * **updatedAt**: The date the reservation was last updated. Format: `yyyy-MM-ddTHH:mm:ssZ`


        Example curl:

        ```

        curl https://{host}/v{X}/merchants/32489/reservations

        ```


        Example response:

        ```

        {

        "reservations": [

        {

        "id": "07f53b36-3f48-11e5-a151-feff819cdc9f",

        "number": 8734957,

        "quandooId": "07f53b36-3f48-11e5-a151-feff819cdc9f",

        "status": "CREATED",

        "startTime": "2015-06-22T12:00:00+00:00",

        "endTime": "2015-06-22T13:00:00+00:00",

        "capacity": 4,

        "merchantId": 1384,

        "customerId": "ce0706ff-a95d-4229-a220-d21dcd175342",

        "promocode": "SOME_CAMPAIGN_CODE",

        "extraInfo": "request for baby chair",

        "links": [

        {

        "href": "https://{host}/v{X}/reservations/07f53b36-3f48-11e5-a151-feff819cdc9f",

        "method": "GET",

        "rel": "self"

        },

        {

        "href": "https://{host}/v{X}/reservations/07f53b36-3f48-11e5-a151-feff819cdc9f",

        "method": "PATCH",

        "rel": "update"

        }

        ],

        "createdAt": "2015-06-01T15:21:54Z",

        "updatedAt": "2015-06-01T18:45:30Z"

        },

        {

        "id": "d8f53b36-3f48-11e5-a151-feff819cdc7a",

        "number": 8734958,

        "quandooId": "d8f53b36-3f48-11e5-a151-feff819cdc7a",

        "status": "CONFIRMED",

        "startTime": "2015-06-22T12:00:00+00:00",

        "endTime": "2015-06-22T13:00:00+00:00",

        "capacity": 3,

        "merchantId": 1384,

        "customerId": "ce0706ff-a95d-4229-a220-d21dcd175342",

        "promocode": "SOME_CAMPAIGN_CODE",

        "links": [

        {

        "href": "https://{host}/v{X}/reservations/d8f53b36-3f48-11e5-a151-feff819cdc7a",

        "method": "GET",

        "rel": "self"

        },

        {

        "href": "https://{host}/v{X}/reservations/d8f53b36-3f48-11e5-a151-feff819cdc7a",

        "method": "PATCH",

        "rel": "update"

        }

        ],

        "createdAt": "2015-06-01T15:21:54Z",

        "updatedAt": "2015-06-01T18:45:30Z"

        }

        ],

        offset:0,

        limit:100

        }

        ```'
      parameters:
      - name: merchantId
        in: path
        required: true
        description: Id of the merchant
        schema:
          type: integer
          format: int32
      - name: offset
        in: query
        required: false
        description: Skip first n reservations
        schema:
          type: integer
          format: int32
          default: 0
      - name: limit
        in: query
        required: false
